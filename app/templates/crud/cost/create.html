{% extends 'base.html' %}
{% block title %}{{ t('add_period_title') }} · {{ t('app_name') }}{% endblock %}

{% block javascript %}
<script src="{{ url_for('static', filename='js/crud/cost/create.js') }}" type="text/javascript"></script>
{% endblock %}

{% block content %}
<div class="em-page-head">
    <div><h1>{{ t('add_period_title') }}</h1></div>
</div>

<div class="em-card em-form">
    <form id="create-form">
        <div class="row g-3">
            <div class="col-6">
                <label class="form-label" for="start-input">{{ t('start') }}</label>
                <input class="form-control" id="start-input" name="start" required type="date">
            </div>
            <div class="col-6">
                <label class="form-label" for="end-input">{{ t('end') }}</label>
                <input class="form-control" id="end-input" name="end" type="date">
                <div class="form-text">{{ t('end_hint') }}</div>
            </div>
            <div class="col-6">
                <label class="form-label" for="kwh-input"><span class="em-dot kwh"></span> {{ t('kwh_installment_eur') }}</label>
                <input class="form-control" id="kwh-input" name="kwh" required step="any" min="0" type="number" inputmode="decimal">
            </div>
            <div class="col-6">
                <label class="form-label" for="smc-input"><span class="em-dot smc"></span> {{ t('smc_installment_eur') }}</label>
                <input class="form-control" id="smc-input" name="smc" required step="any" min="0" type="number" inputmode="decimal">
            </div>
            <div class="col-6">
                <label class="form-label" for="kwh_cost-input"><span class="em-dot kwh"></span> {{ t('kwh_unit_eur') }}</label>
                <input class="form-control" id="kwh_cost-input" name="kwh_cost" required step="any" min="0" type="number" inputmode="decimal">
            </div>
            <div class="col-6">
                <label class="form-label" for="smc_cost-input"><span class="em-dot smc"></span> {{ t('smc_unit_eur') }}</label>
                <input class="form-control" id="smc_cost-input" name="smc_cost" required step="any" min="0" type="number" inputmode="decimal">
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> {{ t('save_period') }}</button>
            <a href="/cost/list" class="btn btn-ghost">{{ t('cancel') }}</a>
        </div>
    </form>
</div>

{% endblock %}
