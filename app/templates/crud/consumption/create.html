{% extends 'base.html' %}
{% block title %}Add reading · Energy Monitor{% endblock %}

{% block javascript %}
<script src="{{ url_for('static', filename='js/crud/consumption/create.js') }}" type="text/javascript"></script>
{% endblock %}

{% block content %}
<div class="em-page-head">
    <div>
        <h1>Add reading</h1>
        <p class="em-sub">Actual readings only — an estimated month waits for the bill that recalculates it</p>
    </div>
</div>

<div class="em-card em-form">
    <form id="create-form">
        <div class="row g-3">
            <div class="col-6">
                <label class="form-label" for="year-input">Year</label>
                <input class="form-control" id="year-input" name="year" required type="number" min="2000" max="2100">
            </div>
            <div class="col-6">
                <label class="form-label" for="month-input">Month</label>
                <input class="form-control" id="month-input" name="month" required type="number" min="1" max="12">
            </div>
            <div class="col-6">
                <label class="form-label" for="kwh-input"><span class="em-dot kwh"></span> Electricity (kWh)</label>
                <input class="form-control" id="kwh-input" name="kwh" required type="number" step="0.01" min="0" inputmode="decimal">
            </div>
            <div class="col-6">
                <label class="form-label" for="smc-input"><span class="em-dot smc"></span> Gas (Smc)</label>
                <input class="form-control" id="smc-input" name="smc" required type="number" step="0.01" min="0" inputmode="decimal">
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Save reading</button>
            <a href="/consumption/list" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
