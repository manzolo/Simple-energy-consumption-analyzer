{% extends 'base.html' %}
{% block title %}{{ t('add_reading_title') }} · {{ t('app_name') }}{% endblock %}

{% block javascript %}
<script src="{{ url_for('static', filename='js/crud/consumption/create.js') }}" type="text/javascript"></script>
{% endblock %}

{% block content %}
<div class="em-page-head">
    <div>
        <h1>{{ t('add_reading_title') }}</h1>
        <p class="em-sub">{{ t('reading_form_sub') }}</p>
    </div>
</div>

<div class="em-card em-form">
    <form id="create-form">
        <div class="row g-3">
            <div class="col-6">
                <label class="form-label" for="year-input">{{ t('year') }}</label>
                <input class="form-control" id="year-input" name="year" required type="number" min="2000" max="2100">
            </div>
            <div class="col-6">
                <label class="form-label" for="month-input">{{ t('month') }}</label>
                <input class="form-control" id="month-input" name="month" required type="number" min="1" max="12">
            </div>
            <div class="col-6">
                <label class="form-label" for="kwh-input"><span class="em-dot kwh"></span> {{ t('electricity_kwh') }}</label>
                <input class="form-control" id="kwh-input" name="kwh" required type="number" step="any" min="0" inputmode="decimal">
            </div>
            <div class="col-6">
                <label class="form-label" for="smc-input"><span class="em-dot smc"></span> {{ t('gas_smc') }}</label>
                <input class="form-control" id="smc-input" name="smc" required type="number" step="any" min="0" inputmode="decimal">
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> {{ t('save_reading') }}</button>
            <a href="/consumption/list" class="btn btn-ghost">{{ t('cancel') }}</a>
        </div>
    </form>
</div>

{% endblock %}
