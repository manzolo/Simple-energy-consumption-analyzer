{% extends 'base.html' %}
{% block title %}Readings · Energy Monitor{% endblock %}

{% block endbody %}
<script src="{{ url_for('static', filename='js/crud/consumption/list.js') }}" type="text/javascript"></script>
{% endblock %}

{% block content %}
<div class="em-page-head">
    <div>
        <h1>Readings</h1>
        <p class="em-sub">Monthly consumption, actual readings only</p>
    </div>
    <div class="em-actions">
        <button class="btn btn-ghost" onclick="exportConsumption()" type="button"><i class="bi bi-download"></i> Export</button>
        <button class="btn btn-primary" onclick="addConsumption()" type="button"><i class="bi bi-plus-lg"></i> Add reading</button>
    </div>
</div>

<div class="em-card mb-4">
    <div class="row g-2 mb-3">
        <div class="col-12 col-md-5">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchInput" placeholder="Search…">
            </div>
        </div>
        <div class="col-6 col-md-3">
            <select class="form-select" id="yearFilter"><option value="">All years</option></select>
        </div>
        <div class="col-6 col-md-3">
            <select class="form-select" id="monthFilter"><option value="">All months</option></select>
        </div>
        <div class="col-12 col-md-1">
            <button class="btn btn-ghost w-100 justify-content-center" onclick="clearFilters()" title="Clear filters"><i class="bi bi-x-lg"></i></button>
        </div>
    </div>

    <div class="row g-2 mb-3 num">
        <div class="col-6 col-md-3"><div class="em-stat"><small><span class="em-dot kwh"></span> Total kWh</small><strong id="totalKwh">–</strong></div></div>
        <div class="col-6 col-md-3"><div class="em-stat"><small><span class="em-dot smc"></span> Total Smc</small><strong id="totalSmc">–</strong></div></div>
        <div class="col-6 col-md-3"><div class="em-stat"><small>Avg kWh / month</small><strong id="avgKwh">–</strong></div></div>
        <div class="col-6 col-md-3"><div class="em-stat"><small>Avg Smc / month</small><strong id="avgSmc">–</strong></div></div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle num">
            <thead>
                <tr>
                    <th>Month</th>
                    <th class="text-end"><span class="em-dot kwh"></span> Electricity</th>
                    <th class="text-end"><span class="em-dot smc"></span> Gas</th>
                    <th class="text-end" style="width: 90px"></th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="4" class="em-empty"><div class="spinner-border spinner-border-sm"></div> Loading…</td></tr>
            </tbody>
        </table>
    </div>
    <div class="mt-3"><small class="text-muted" id="recordInfo"></small></div>
</div>
{% endblock %}
